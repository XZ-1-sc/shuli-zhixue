<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行测智脑 - 做题练习</title>
    <script src="./static/js/practice.js?v=20260714e" defer></script>
  <style>
    :root {
      --bg: #07162c;
      --panel: rgba(12, 35, 66, 0.72);
      --panel-strong: rgba(9, 30, 58, 0.9);
      --border: rgba(160, 216, 255, 0.22);
      --text: #eaf6ff;
      --muted: #9fc8dd;
      --accent: #72d4ff;
      --good: #7df4bc;
      --bad: #ffaaa8;
      --warning: #f8c76a;
      --shadow: 0 22px 80px rgba(0, 8, 28, 0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 80% 12%, rgba(43, 167, 255, 0.24), transparent 28%),
        radial-gradient(circle at 16% 88%, rgba(25, 210, 232, 0.12), transparent 30%),
        linear-gradient(135deg, rgba(12, 35, 66, 0.98), rgba(4, 14, 32, 1));
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      padding: 20px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
    }

    .topbar,
    .panel {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), var(--shadow);
    }

    .topbar {
      min-height: 72px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 900;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7dd3fc, #0ea5e9);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill,
    .ghost-button,
    .primary-button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 999px;
      transition: all 0.25s ease;
      font-weight: 800;
    }

    .pill,
    .ghost-button {
      color: #cdefff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .primary-button {
      color: #062033;
      background: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      gap: 18px;
      min-height: 0;
    }

    .sidebar,
    .question-panel {
      padding: 20px;
    }

    .sidebar-title,
    .question-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sidebar-title h2,
    .question-title-row h1 {
      font-size: 20px;
      line-height: 1.3;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .type-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 4px;
    }

    .type-card {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      color: var(--text);
      text-align: left;
      background: rgba(255, 255, 255, 0.065);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
    }

    .type-card strong {
      display: block;
      margin-bottom: 5px;
    }

    .question-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }

    .question-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .question-body {
      min-height: 420px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: var(--panel-strong);
      padding: 22px;
      overflow-y: auto;
    }

    .question-text {
      font-size: 18px;
      line-height: 1.85;
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    .answer-options {
      display: grid;
      gap: 11px;
    }

    .answer-option {
      width: 100%;
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      align-items: start;
      padding: 14px;
      border-radius: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: left;
      line-height: 1.7;
      transition: all 0.25s ease;
    }

    .option-label {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #062033;
      background: var(--accent);
      font-weight: 900;
    }

    .answer-option.is-selected {
      border-color: rgba(114, 212, 255, 0.8);
      background: rgba(20, 112, 151, 0.28);
    }

    .answer-option.is-correct {
      border-color: rgba(125, 244, 188, 0.85);
      background: rgba(25, 190, 120, 0.18);
    }

    .answer-option.is-wrong {
      border-color: rgba(255, 170, 168, 0.85);
      background: rgba(190, 45, 45, 0.18);
    }

    .subjective-box {
      width: 100%;
      min-height: 190px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      outline: none;
      line-height: 1.7;
    }

    .feedback {
      min-height: 72px;
      padding: 14px 16px;
      border-radius: 14px;
      color: #dff8ff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .type-list {
        max-height: 260px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <span>行测智脑 · 做题练习</span>
      </div>
      <div class="top-actions">
        <span class="pill" id="userLabel">未登录</span>
        <span class="pill" id="modeLabel">随机练习</span>
        <button class="ghost-button" id="mockButton" type="button">模拟考试</button>
        <button class="ghost-button" id="reloadButton" type="button">重新抽题</button>
        <button class="primary-button" id="homeButton" type="button">返回首页</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel sidebar">
        <div class="sidebar-title">
          <div>
            <h2>题型分类</h2>
            <p class="muted">选择题、简答题、材料分析都会按模块随机抽取。</p>
          </div>
        </div>
        <div class="type-list" id="typeList"></div>
      </aside>

      <section class="panel question-panel">
        <div>
          <div class="question-title-row">
            <div>
              <h1 id="practiceTitle">题目练习</h1>
              <p class="muted" id="practiceSubtitle">正在加载题目...</p>
            </div>
            <span class="pill" id="questionProgress">第 0 / 0 题</span>
          </div>
          <div class="question-meta" id="questionMeta"></div>
        </div>

        <div class="question-body">
          <div class="question-text" id="questionText">正在抽题...</div>
          <div class="answer-options" id="answerOptions"></div>
          <textarea class="subjective-box" id="subjectiveAnswer" placeholder="在这里作答简答题..." hidden></textarea>
        </div>

        <div>
          <div class="feedback" id="feedback">提交后会显示正确答案、参考答案或主观题关键词评分。</div>
          <div class="footer-actions">
            <button class="primary-button" id="submitButton" type="button">提交答案</button>
            <button class="ghost-button" id="nextButton" type="button">下一题</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
