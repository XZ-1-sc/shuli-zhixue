<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行测智脑 - 方案刷题</title>
    <script src="./static/js/plan.js?v=20260714e" defer></script>
  <style>
    :root {
      --bg: #07162c;
      --panel: rgba(12, 35, 66, 0.74);
      --panel-strong: rgba(8, 28, 55, 0.92);
      --border: rgba(160, 216, 255, 0.22);
      --border-bright: rgba(114, 212, 255, 0.46);
      --text: #eaf6ff;
      --muted: #9fc8dd;
      --accent: #72d4ff;
      --good: #7df4bc;
      --warning: #f8c76a;
      --shadow: 0 24px 90px rgba(0, 8, 28, 0.36);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 16%, rgba(114, 212, 255, 0.18), transparent 28%),
        radial-gradient(circle at 86% 10%, rgba(24, 155, 212, 0.2), transparent 26%),
        linear-gradient(135deg, rgba(7, 20, 42, 1), rgba(5, 15, 34, 1));
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .page {
      min-height: 100vh;
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .topbar,
    .panel,
    .task-card,
    .metric-card {
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), var(--shadow);
    }

    .topbar {
      min-height: 78px;
      border-radius: 18px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: linear-gradient(135deg, #7dd3fc, #0ea5e9);
      box-shadow: 0 16px 34px rgba(14, 165, 233, 0.28);
    }

    .brand strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions,
    .task-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ghost-button,
    .primary-button,
    .mini-button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 15px;
      font-weight: 900;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .ghost-button,
    .mini-button {
      color: #d7f3ff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
    }

    .primary-button {
      color: #062033;
      background: var(--accent);
    }

    .ghost-button:hover,
    .primary-button:hover,
    .mini-button:hover,
    .task-card:hover,
    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15), var(--shadow);
    }

    .hero {
      min-height: 220px;
      border-radius: 22px;
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
      gap: 20px;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -8% -36% 58%;
      height: 220px;
      border-radius: 999px;
      background: rgba(114, 212, 255, 0.14);
      filter: blur(28px);
      pointer-events: none;
    }

    .kicker {
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
    }

    h1 {
      margin-top: 10px;
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .summary {
      width: min(720px, 100%);
      margin-top: 14px;
      color: #c5e4f4;
      line-height: 1.8;
      font-size: 16px;
    }

    .hero-metrics {
      display: grid;
      gap: 12px;
      align-content: end;
      position: relative;
      z-index: 1;
    }

    .metric-card {
      border-radius: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.07);
    }

    .metric-card span {
      color: var(--muted);
      font-size: 13px;
    }

    .metric-card strong {
      display: block;
      margin-top: 6px;
      font-size: 30px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      gap: 18px;
    }

    .panel {
      border-radius: 20px;
      padding: 22px;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .section-head h2 {
      font-size: 24px;
      line-height: 1.2;
    }

    .section-head p,
    .muted {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .task-grid {
      display: grid;
      gap: 12px;
    }

    .task-card {
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      background: rgba(255, 255, 255, 0.065);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .task-card.is-done {
      border-color: rgba(125, 244, 188, 0.46);
      background: rgba(28, 132, 92, 0.18);
    }

    .task-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .tag-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 10px;
      color: #d8f4ff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 13px;
      font-weight: 800;
    }

    .tag.done {
      color: #072217;
      background: var(--good);
      border-color: transparent;
    }

    .mini-button {
      min-height: 34px;
      padding: 0 12px;
      font-size: 14px;
    }

    .completion-list {
      display: grid;
      gap: 10px;
    }

    .completion-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .score-cell {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 13px;
      background: rgba(255, 255, 255, 0.06);
    }

    .score-cell span {
      color: var(--muted);
      font-size: 12px;
    }

    .score-cell strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
    }

    .plan-picker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .plan-option {
      min-height: 128px;
      padding: 15px;
      border-radius: 16px;
      text-align: left;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.065);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .plan-option:hover {
      transform: translateY(-2px);
      border-color: var(--border-bright);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15), var(--shadow);
    }

    .plan-option strong {
      display: block;
      margin: 8px 0;
      font-size: 19px;
    }

    @media (max-width: 980px) {
      .topbar,
      .hero,
      .layout {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .score-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 14px;
      }

      .task-card,
      .completion-row {
        grid-template-columns: 1fr;
      }

      .task-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <strong>行测智脑</strong>
          <span>方案刷题与任务完成查看</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="ghost-button" id="changePlanButton" type="button">换方案</button>
        <button class="ghost-button" id="homeButton" type="button">回首页</button>
      </div>
    </header>

    <section class="panel hero">
      <div>
        <div class="kicker" id="planKicker">专属备考方案</div>
        <h1 id="planTitle">正在载入方案</h1>
        <p class="summary" id="planSummary">系统会根据你选择的考试类型和岗位类别生成训练优先级，并在这里查看每项任务完成情况。</p>
        <div class="tag-row" id="focusTags"></div>
      </div>
      <div class="hero-metrics">
        <div class="metric-card">
          <span>任务完成</span>
          <strong id="completionMetric">0/0</strong>
        </div>
        <div class="metric-card">
          <span>最近记录</span>
          <strong id="recordMetric">0</strong>
        </div>
      </div>
    </section>

    <main class="layout">
      <section class="panel">
        <div class="section-head">
          <div>
            <h2>方案刷题</h2>
            <p>按优先级进入专项练习，完成后回到本页标记任务。</p>
          </div>
          <button class="primary-button" id="mockButton" type="button">模拟考试</button>
        </div>
        <div class="task-grid" id="taskList"></div>
      </section>

      <aside class="panel">
        <div class="section-head">
          <div>
            <h2>完成查看</h2>
            <p>任务进度保存在当前账号下，方案切换后会独立统计。</p>
          </div>
        </div>
        <div class="completion-list" id="completionList"></div>
        <div class="score-grid" id="scoreGrid"></div>
      </aside>
    </main>

    <section class="panel" id="fallbackPicker" hidden>
      <div class="section-head">
        <div>
          <h2>选择一个方案</h2>
          <p>没有检测到当前方案，可以在这里选择后进入对应训练页。</p>
        </div>
      </div>
      <div class="plan-picker" id="planPicker"></div>
    </section>
  </div>
</body>
</html>
