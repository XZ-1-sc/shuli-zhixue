name: Docker Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create CI env file
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=mysql+pymysql://root:password@host.docker.internal:3306/math_brain
          LLM_API_KEY=
          LLM_BASE_URL=https://api.deepseek.com/v1
          EOF

      - name: Python syntax check
        run: |
          python -m pip install -r backend/requirements.txt
          python -m compileall -q backend scripts
          python scripts/test_question_document_parser.py

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compose config check
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build backend gateway
