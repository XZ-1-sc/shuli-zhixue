name: xingce-smartbrain

services:
  backend:
    image: math-smartbrain-backend:local
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MATH_BRAIN_DOCKER: "1"
      DOCKER_DATABASE_URL: ${DOCKER_DATABASE_URL:-}
      UPLOAD_DIR: /workspace/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - math_answer_uploads:/workspace/uploads
    restart: unless-stopped

  gateway:
    image: math-smartbrain-gateway:local
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    depends_on:
      - gateway
    command: tunnel --no-autoupdate --protocol http2 --url http://gateway:80
    restart: "no"

volumes:
  math_answer_uploads:
